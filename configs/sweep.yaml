program: scripts/train_lora.py
method: bayes
metric:
  name: eval_loss
  goal: minimize
parameters:
  lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 5e-4
  lora-r:
    values: [8, 16, 32]
  lora-alpha:
    values: [16, 32, 64]
  batch-size:
    values: [4, 8, 16]
  epochs:
    values: [1, 2, 3]
command:
  - ${env}
  - python
  - ${program}
  - --model=Qwen/Qwen2.5-0.5B-Instruct
  - --train-file=data/train.jsonl
  - --val-file=data/val.jsonl
  - --output-dir=runs/sweep
  - ${args}
